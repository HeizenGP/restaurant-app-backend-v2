[build-system]
requires = ["hatchling~=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "restaurant-app-backend-v2"
version = "0.1.0"
description = "Backend API for Chifa ASIA Restaurant App V2."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic~=1.20.0",
    "asyncpg~=0.32.0",
    "fastapi~=0.156.4",
    "google-auth[requests]~=2.62.1",
    "pydantic-settings~=2.16.1",
    "pyjwt[crypto]~=2.15.1",
    "pwdlib[argon2]~=0.3.1",
    "sqlalchemy[asyncio]~=2.1.5",
    "uvicorn[standard]~=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2~=2.15.1",
    "mypy~=2.4.0",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "ruff~=0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/restaurant_app"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=restaurant_app",
    "--cov-branch",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires TEST_DATABASE_DSN and a database migrated to Alembic head",
]

[tool.coverage.run]
branch = true
source = ["restaurant_app"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["ASYNC", "B", "C4", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
exclude = ["^alembic/"]
no_implicit_optional = true
packages = ["restaurant_app"]
pretty = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

